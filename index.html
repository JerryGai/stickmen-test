<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Stickmen vs Aliens</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #212638;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* Tester lock (2026-11-17, user): a password before the game downloads. Not real security:
   the files are public; it keeps strangers with the link out. */
#lock { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
	background: #212638; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; z-index: 10; }
#lock form { background: #1a1e2e; border: 3px solid #e8b84a; border-radius: 20px; padding: 32px 36px;
	text-align: center; color: #eef0ff; max-width: 360px; width: calc(100% - 32px); box-sizing: border-box; }
#lock h1 { margin: 0 0 8px; font-size: 26px; }
#lock p { margin: 0 0 20px; color: #aab0c8; font-size: 15px; }
#lock input { width: 100%; box-sizing: border-box; font-size: 20px; padding: 12px 14px; border-radius: 12px;
	border: 2px solid #3a4160; background: #0f1220; color: #fff; text-align: center; }
#lock button { margin-top: 16px; width: 100%; font-size: 20px; font-weight: 700; padding: 14px; border: 0;
	border-radius: 14px; background: #6cd13a; color: #10200a; cursor: pointer; }
#lock .wrong { color: #ffd23a; min-height: 20px; margin: 12px 0 0; font-size: 15px; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<div id="lock" style="display:none">
			<form id="lock-form" autocomplete="off">
				<h1>Stickmen vs Aliens</h1>
				<p>Test version. Please enter the password.</p>
				<input id="lock-input" type="password" placeholder="Password" autofocus>
				<button type="submit">Play</button>
				<div class="wrong" id="lock-wrong"></div>
			</form>
		</div>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":66012224,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		withPassword(startNow);
	}

	// The tester lock: SHA-256 of the password (lower case, trimmed); remembered in this browser.
	function withPassword(go) {
		const HASH = '1caea49753faec4173e33ec359a7514b4160403d3c5d75d763de5e503c74ab55';
		const KEY = 'sva_unlocked';
		try {
			if (localStorage.getItem(KEY) === HASH) {
				go();
				return;
			}
		} catch (e) { /* private window: ask every time */ }
		const lock = document.getElementById('lock');
		const input = document.getElementById('lock-input');
		const wrong = document.getElementById('lock-wrong');
		lock.style.display = 'flex';
		input.focus();
		document.getElementById('lock-form').addEventListener('submit', async (ev) => {
			ev.preventDefault();
			const bytes = new TextEncoder().encode(input.value.trim().toLowerCase());
			const digest = await crypto.subtle.digest('SHA-256', bytes);
			const hex = Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
			if (hex !== HASH) {
				wrong.textContent = '! Wrong password, try again';
				input.select();
				return;
			}
			try {
				localStorage.setItem(KEY, HASH);
			} catch (e) { /* fine */ }
			lock.remove();
			go();
		});
	}

	function startNow() {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
